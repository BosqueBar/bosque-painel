<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bosque · painel ao vivo</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3E9; --surface1: #FFFDF7; --surface2: #FBF7EC; --border: #E1D8C0;
    --text-primary: #1B3A1E; --text-secondary: #55624C; --text-muted: #8C8468;
    --teal: #2B4E2F; --coral: #B98A2E; --pink: #8B4049; --blue: #2C5F5A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px; margin-left: auto; margin-right: auto;
  }
  a { color: inherit; text-decoration: none; }
  .brandbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brandbar img { width: 34px; height: auto; border-radius: 50%; flex-shrink: 0; }
  .brandbar span { font-size: 12px; letter-spacing: 0.02em; color: var(--text-muted); }
  .header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .header h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; margin: 0; color: var(--text-primary); }
  .header p { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }
  .nav-link { font-size: 12px; color: var(--teal); white-space: nowrap; padding: 6px 12px;
    border: 1px solid var(--teal); border-radius: 999px; }
  .card { background: var(--surface1); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card-outline { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .label { font-size: 12px; color: var(--text-muted); margin: 0 0 4px; }
  .value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; margin: 0; color: var(--text-primary); }
  .sub-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .sub-row strong { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .section-title { font-size: 12px; color: var(--text-secondary); margin: 0 0 10px; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 8px; background: var(--border); }
  .bar-teal { background: var(--teal); } .bar-coral { background: var(--coral); }
  .bar-pink { background: var(--pink); } .bar-blue { background: var(--blue); }
  .legend { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-secondary); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; }
  table { width: 100%; font-size: 12px; border-collapse: collapse; color: var(--text-secondary); }
  td { padding: 3px 0; }
  .td-right { text-align: right; }
  .muted { color: var(--text-muted); }
  .empty { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
  .item-lista { display: block; background: var(--surface1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    margin-bottom: 8px; }
  .item-lista .nome { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; margin: 0 0 2px; color: var(--text-primary); }
  .item-lista .data { font-size: 12px; color: var(--text-muted); margin: 0; }
  .badge-passado { display: inline-block; font-size: 11px; color: var(--coral);
    border: 1px solid var(--coral); border-radius: 999px; padding: 3px 10px; margin-bottom: 10px; }
  /* layout B */
  .b-hero { display: flex; justify-content: space-between; align-items: flex-end; }
  .b-hero .r { text-align: right; }
  .b-hero .r b { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 700; color: var(--text-primary); }
  .b-big { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1; margin: 0; color: var(--text-primary); }
  .b-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .b-chip { font-size: 11px; color: var(--text-muted); }
  .b-chip b { display: block; font-size: 15px; color: var(--text-primary); margin-top: 2px; }
  .b-chip em { font-style: normal; font-weight: 400; font-size: 11px; color: var(--text-muted); }
  .b-val { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; margin: 0; color: var(--text-primary); }
  .b-tm { font-size: 12px; margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--border); color: var(--text-secondary); }
  .b-tm b { color: var(--text-primary); }
  .b-tm span { display: block; font-size: 11px; color: var(--text-muted); }
  .b-st { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 0 0 10px; }
  .b-pc { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
  .b-table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text-secondary); }
  .b-table th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: right; padding: 5px 0; }
  .b-table th:first-child { text-align: left; }
  .b-table td { padding: 5px 0; }
  .b-table td.n { text-align: right; color: var(--text-primary); }
  .b-table tr + tr td { border-top: 1px solid #EFE7D2; }
  .b-nota { font-size: 11px; color: var(--text-muted); margin: 8px 0 0; }
  .g-kpis { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin: 0 0 4px; }
  .g-kpis b { color: var(--text-primary); }
  .g-chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin-top: 6px; }
  .g-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
  .g-col .g-b { width: 100%; border-radius: 5px 5px 2px 2px; min-height: 3px; }
  .g-col .g-v { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; white-space: nowrap; }
  .g-col .g-v.pk { color: var(--text-primary); font-weight: 700; }
  .g-col .g-h { font-size: 10px; color: var(--text-muted); margin-top: 5px; }
  .fontes { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  .fonte { font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-secondary); background:var(--surface1); }
  .fonte.velha { border-color:#B3261E; color:#B3261E; background:#FDECEA; }
  .fonte.erro { border-color:#B98A2E; color:#8A6420; background:#FBF1DC; }
  .avisos { font-size:11px; color:var(--text-muted); margin:0 0 10px; }
</style>
</head>
<body>
  <div class="brandbar"><img src="/logo.png" alt="Bosque"><span>bosque. · painel ao vivo</span></div>
  <div class="header">
    <div><h1 id="nome-evento">Carregando…</h1><p id="atualizado">carregando...</p></div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><a class="nav-link" id="nav-link" href="#"></a><a class="nav-link" id="link-admin" href="/admin" style="display:none">Administração</a><a class="nav-link" id="link-sair" href="#" style="display:none;border-color:var(--text-muted);color:var(--text-muted)">Sair</a></div>
  </div>
  <div id="conteudo"></div>
<script>
const P = new URLSearchParams(location.search);
const CHAVE = P.get('chave') || '';
const NOITE = P.get('noite') || '';
const HISTORICO = P.get('historico') === '1';
let HOJE = '';
const NOMES_FONTE = { sympla: 'Sympla', zig_ingressos: 'Porta', zig_bar: 'Bar', ugo: 'Lista' };
const LIMITE_VELHA_MS = 3 * 60000;

function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function irPara(params) {
  const q = new URLSearchParams();
  if (CHAVE) q.set('chave', CHAVE);
  Object.keys(params).forEach(function (k) { if (params[k]) q.set(k, params[k]); });
  location.href = location.pathname + (q.toString() ? '?' + q.toString() : '');
}
function configurarNav() {
  const nav = document.getElementById('nav-link');
  if (HISTORICO) { nav.textContent = '← Ao vivo'; nav.onclick = function (e) { e.preventDefault(); irPara({}); }; }
  else if (NOITE && NOITE !== HOJE) { nav.textContent = '← Eventos'; nav.onclick = function (e) { e.preventDefault(); irPara({ historico: '1' }); }; }
  else { nav.textContent = 'Eventos'; nav.onclick = function (e) { e.preventDefault(); irPara({ historico: '1' }); }; }
}
function renderizarLista(lista, proximas, hoje) {
  document.getElementById('nome-evento').textContent = 'Eventos';
  const total = (lista ? lista.length : 0) + (proximas ? proximas.length : 0) + (hoje ? hoje.length : 0);
  document.getElementById('atualizado').textContent = total + ' evento(s)';
  const c = document.getElementById('conteudo');
  if (!total) { c.innerHTML = '<div class="empty">Nenhum evento encontrado ainda.</div>'; return; }
  const itens = function (l) { return l.map(function (i) {
    return '<a class="item-lista" href="#" data-data="' + esc(i.data) + '"><p class="nome">' + esc(i.evento || i.data) + '</p><p class="data">' + esc(i.data.split('-').reverse().join('/')) + '</p></a>';
  }).join(''); };
  c.innerHTML = (hoje && hoje.length ? '<p class="section-title">Hoje · ao vivo</p>' + itens(hoje) : '') + (proximas && proximas.length ? '<p class="section-title"' + (hoje && hoje.length ? ' style="margin-top:14px"' : '') + '>Próximos eventos</p>' + itens(proximas) : '') +
    (lista && lista.length ? '<p class="section-title" style="margin-top:14px">Eventos passados</p>' + itens(lista) : '');
  Array.prototype.forEach.call(c.querySelectorAll('.item-lista'), function (el) {
    el.onclick = function (e) { e.preventDefault(); irPara({ noite: el.getAttribute('data-data') }); };
  });
}
function htmlFontes(fontes, noiteAoVivo, proxima) {
  if (!fontes) return '';
  return '<div class="fontes">' + Object.keys(NOMES_FONTE).filter(function (k) { return !proxima || k === 'sympla' || k === 'ugo'; }).map(function (k) {
    const f = fontes[k];
    if (!f) return '<span class="fonte erro">' + NOMES_FONTE[k] + ': sem leitura</span>';
    let cls = 'fonte', txt = NOMES_FONTE[k] + ' ' + tempoRelativo(f.atualizado_em);
    if (f.erro) { cls += ' erro'; txt += ' · falha na última leitura'; }
    else if (noiteAoVivo && f.atualizado_em && Date.now() - new Date(f.atualizado_em).getTime() > LIMITE_VELHA_MS) cls += ' velha';
    return '<span class="' + cls + '">' + txt + '</span>';
  }).join('') + '</div>';
}
function renderizarProximo(d, perm) {
  const conteudo = document.getElementById('conteudo');
  document.getElementById('nome-evento').textContent = d.evento || 'Próximo evento';
  document.getElementById('atualizado').textContent = 'Atualizado ' + tempoRelativo(d.atualizado_em) + ' · de hora em hora até o evento';
  const listaNomes = Number(d.lista_convidados) || 0;
  const falta = Number(d.falta_entrar_antecipado) || 0;
  const topo = perm.contagem
    ? '<div class="b-hero"><div><p class="label">Antecipado esperado</p><p class="b-big">' + fmt(falta) + '</p></div>' +
      '<div class="r"><p class="label">Na lista</p><b>' + fmt(listaNomes) + '</b></div></div>'
    : '';
  const chips = perm.bilheteria ? '<div class="b-chips"' + (perm.contagem ? '' : ' style="margin-top:0;padding-top:0;border-top:0"') + '>' +
    '<div class="b-chip">Antecipado vendido<b>' + fmt(d.quantidade_venda_sympla) + '</b></div>' +
    '<div class="b-chip">Bilheteria<b>' + fmtMoeda(d.bilheteria_sympla) + '</b></div>' +
    '<div class="b-chip">Cortesia<b>' + fmt(d.cortesia_validada_total) + '</b></div></div>' : '';
  conteudo.innerHTML = '<span class="badge-passado" style="color:var(--teal);border-color:var(--teal)">Próximo evento · só venda antecipada e lista</span>' +
    htmlFontes(d.fontes, false, true) +
    ((topo || chips) ? '<div class="card">' + topo + chips + '</div>' : '') +
    (perm.contagem ? '<div class="card-outline"><p class="b-st">Antecipado por gênero</p><table class="b-table"><tr><th></th><th>Fem.</th><th>Masc.</th></tr>' +
      '<tr><td>Ingressos vendidos</td><td class="n">' + fmt(d.falta_entrar_antecipado_feminino) + '</td><td class="n">' + fmt(d.falta_entrar_antecipado_masculino) + '</td></tr></table></div>' : '');
}
function renderizar(d, hoje, noite, aoVivo, proxima) {
  const conteudo = document.getElementById('conteudo');
  if (!d) { conteudo.innerHTML = '<div class="empty">Sem dados ainda para esse evento.</div>'; return; }
  const perm = d.perm || { contagem: true, bilheteria: true, bar: true };
  if (proxima) return renderizarProximo(d, perm);
  document.getElementById('nome-evento').textContent = d.evento || 'Bosque · painel ao vivo';
  document.getElementById('atualizado').textContent = aoVivo ? 'Atualizado ' + tempoRelativo(d.atualizado_em) : 'Última atualização registrada: ' + tempoRelativo(d.atualizado_em);

  const feminino = Number(d.na_casa_feminino) || 0, masculino = Number(d.na_casa_masculino) || 0;
  const totalGenero = feminino + masculino;
  const pctFem = totalGenero ? Math.round((feminino / totalGenero) * 100) : 0;
  const pctMasc = totalGenero ? (100 - pctFem) : 0;
  const listaNomes = Number(d.lista_convidados) || 0, listaEntraram = Number(d.lista_entraram) || 0;
  const pctConversaoLista = listaNomes ? (Math.round((listaEntraram / listaNomes) * 1000) / 10).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : '0,0';
  const cvF = Number(d.cortesia_validada_feminino) || 0, cvM = Number(d.cortesia_validada_masculino) || 0, cvS = Number(d.cortesia_validada_sem_genero) || 0;

  const cardBilheteria = '<div class="card"><p class="label">Bilheteria</p><p class="b-val">' + fmtMoeda(d.bilheteria_total) + '</p><p class="b-tm">Ticket médio <b>' + fmtMoeda(d.ticket_medio_bilheteria) + '</b><span>por pessoa na casa</span></p></div>';
  const cardBar = '<div class="card"><p class="label">Bar</p><p class="b-val">' + fmtMoeda(d.faturamento_bar_recebido) + '</p><p class="b-tm">Ticket médio <b>' + fmtMoeda(d.ticket_medio_bar) + '</b><span>por pessoa na casa</span></p></div>';
  const dinheiro = (perm.bilheteria && perm.bar) ? '<div class="grid-2">' + cardBilheteria + cardBar + '</div>' : (perm.bilheteria ? cardBilheteria : (perm.bar ? cardBar : ''));

  const mapaEntradas = perm.contagem ? parseMapaHora(d.entradas_por_hora) : null;
  const mapaConsumo = perm.bar ? parseMapaHora(d.consumo_por_hora) : null;
  const graficos = (mapaEntradas ? htmlGrafico('Horário de entrada', mapaEntradas, '#2B4E2F', '#1B3A1E', 'qtd') : '') +
    (mapaConsumo ? htmlGrafico('Consumo do bar por hora', mapaConsumo, '#B98A2E', '#8A6420', 'moeda') : '');

  const heroTopo = perm.contagem ? '<div class="b-hero">' +
      '<div><p class="label">Na casa</p><p class="b-big">' + fmt(d.pessoas_na_casa) + '</p></div>' +
      '<div class="r"><p class="label">Falta entrar</p><b>' + fmt(d.falta_entrar_antecipado) + '</b></div></div>' : '';
  const chips = perm.bilheteria ? '<div class="b-chips"' + (perm.contagem ? '' : ' style="margin-top:0;padding-top:0;border-top:0"') + '>' +
      '<div class="b-chip">Antecipado<b>' + fmt(d.quantidade_checkin_sympla) + ' <em>/ ' + fmt(d.quantidade_venda_sympla) + '</em></b></div>' +
      '<div class="b-chip">Porta<b>' + fmt(d.quantidade_checkin_porta) + ' <em>/ ' + fmt(d.quantidade_venda_porta) + '</em></b></div>' +
      '<div class="b-chip">Cortesia<b>' + fmt(d.cortesia_validada_total) + '</b></div></div>' : '';

  conteudo.innerHTML =
    (!aoVivo ? '<span class="badge-passado">Evento passado</span>' : '') +
    htmlFontes(d.fontes, aoVivo) +
    ((heroTopo || chips) ? '<div class="card">' + heroTopo + chips + '</div>' : '') +
    dinheiro +
    (perm.contagem ? '<div class="card-outline"><p class="b-st">Gênero</p>' +
      '<div class="bar"><div class="bar-pink" style="width:' + pctFem + '%"></div><div class="bar-blue" style="width:' + pctMasc + '%"></div></div>' +
      '<div class="b-pc"><span><span class="dot" style="background:var(--pink)"></span>Feminino ' + pctFem + '%</span><span><span class="dot" style="background:var(--blue)"></span>Masculino ' + pctMasc + '%</span></div>' +
      '<table class="b-table"><tr><th></th><th>Fem.</th><th>Masc.</th></tr>' +
      '<tr><td>Na casa</td><td class="n">' + fmt(feminino) + '</td><td class="n">' + fmt(masculino) + '</td></tr>' +
      '<tr><td>Cortesia validada</td><td class="n">' + fmt(cvF) + '</td><td class="n">' + fmt(cvM) + '</td></tr>' +
      '<tr><td>Falta entrar (antecipado)</td><td class="n">' + fmt(d.falta_entrar_antecipado_feminino) + '</td><td class="n">' + fmt(d.falta_entrar_antecipado_masculino) + '</td></tr></table>' +
      (cvS ? '<p class="b-nota">+ ' + fmt(cvS) + ' cortesia sem gênero identificado</p>' : '') + '</div>' : '') +
    (perm.contagem ? htmlOrigem(d, perm) : '') +
    (perm.contagem && listaNomes > 0 ? '<div class="card-outline"><p class="b-st">Lista</p><table class="b-table">' +
      '<tr><td>Nomes na lista</td><td class="n">' + fmt(listaNomes) + '</td></tr>' +
      '<tr><td>Entraram</td><td class="n">' + fmt(listaEntraram) + '</td></tr>' +
      '<tr><td>Conversão</td><td class="n"><strong>' + pctConversaoLista + '%</strong></td></tr></table></div>' : '') +
    graficos;
}

// ---- de onde veio cada pessoa que entrou ----
function htmlOrigem(d, perm) {
  const n = (k) => Number(d[k]) || 0;
  const cortSym = n('origem_cortesia_sympla'), cortPorta = n('origem_cortesia_porta'), cortLista = n('origem_cortesia_lista');
  const cortTotal = cortSym + cortPorta + cortLista;
  const linhas = [
    ['Sympla (antecipado)', n('origem_sympla_pago')],
    ['Bilheteria (porta, sem lista)', n('origem_porta_pago')],
    ['Lista paga', n('origem_lista_paga')],
    ['Cortesia', cortTotal]
  ];
  const total = linhas[0][1] + linhas[1][1] + linhas[2][1] + linhas[3][1];
  const maximo = Math.max.apply(null, linhas.map(function (l) { return l[1]; }).concat([1]));
  const barra = function (v) { return '<div style="height:6px;border-radius:3px;background:var(--border);margin-top:4px"><div style="height:6px;border-radius:3px;background:#2B4E2F;width:' + Math.round(v / maximo * 100) + '%"></div></div>'; };
  let h = '<div class="card-outline"><p class="b-st">Por onde entrou</p><table class="b-table">' +
    linhas.map(function (l) { return '<tr><td>' + l[0] + barra(l[1]) + '</td><td class="n">' + fmt(l[1]) + '</td></tr>'; }).join('') +
    '<tr><td><strong>Total na casa</strong></td><td class="n"><strong>' + fmt(total) + '</strong></td></tr></table>';
  const partes = [];
  if (cortSym) partes.push('Sympla ' + fmt(cortSym));
  if (cortPorta) partes.push('porta ' + fmt(cortPorta));
  if (cortLista) partes.push('lista ' + fmt(cortLista));
  if (partes.length) h += '<p class="b-nota">Cortesia: ' + partes.join(' · ') + '</p>';
  h += '<p class="b-nota">Lista paga = nome na lista (UGO) que entrou sem ser cortesia; o pagamento foi na porta, por isso sai da bilheteria.</p>';
  const ant = perm.bilheteria && Array.isArray(d.antecipado_lotes) ? d.antecipado_lotes : [];
  if (ant.length) {
    h += '<p class="b-st" style="margin-top:14px">Antecipado (Sympla) por lote</p><table class="b-table"><tr><th></th><th>Vend.</th><th>Entr.</th><th>Valor</th></tr>' +
      ant.map(function (l) { return '<tr><td>' + esc(l.lote) + '</td><td class="n">' + fmt(l.vendidos) + '</td><td class="n">' + fmt(l.entraram) + '</td><td class="n">' + fmtMoeda(l.valor) + '</td></tr>'; }).join('') + '</table>' +
      '<p class="b-nota">Valor = preço do ingresso menos desconto. Entraram = check-in lido pela Sympla (pode atrasar em relação ao total do topo).</p>';
  }
  const lotes = perm.bilheteria && Array.isArray(d.porta_lotes) ? d.porta_lotes : [];
  if (lotes.length) {
    h += '<p class="b-st" style="margin-top:14px">Porta por lote</p><table class="b-table"><tr><th></th><th>Qtd</th><th>Valor</th></tr>' +
      lotes.map(function (l) { return '<tr><td>' + esc(l.lote) + '</td><td class="n">' + fmt(l.qtd) + '</td><td class="n">' + fmtMoeda(l.valor) + '</td></tr>'; }).join('') + '</table>';
  }
  return h + '</div>';
}

// ---- gráficos por hora (entrada e consumo) ----
function parseMapaHora(txt) {
  if (!txt) return null;
  try {
    const o = typeof txt === 'string' ? JSON.parse(txt) : txt;
    const total = Object.keys(o).reduce(function (a, k) { return a + (Number(o[k]) || 0); }, 0);
    return total > 0 ? o : null;
  } catch (e) { return null; }
}
function fmtK(v) { return v >= 1000 ? (v / 1000).toFixed(1).replace('.', ',') + 'k' : String(v); }
// horas ordenadas a partir das 18h (a noite vira o dia); mostra no mínimo 20h–03h
function horasDoGrafico(mapa) {
  const pos = function (h) { return (Number(h) - 18 + 24) % 24; };
  const ps = Object.keys(mapa).filter(function (h) { return Number(mapa[h]) > 0; }).map(pos);
  const ini = Math.min.apply(null, ps.concat([2]));
  const fim = Math.max.apply(null, ps.concat([9]));
  const horas = [];
  for (let p = ini; p <= fim; p++) {
    const h = (p + 18) % 24;
    horas.push((h < 10 ? '0' : '') + h);
  }
  return horas;
}
function htmlGrafico(titulo, mapa, cor, corPico, tipo) {
  const horas = horasDoGrafico(mapa);
  const vals = horas.map(function (h) { return Number(mapa[h]) || 0; });
  const max = Math.max.apply(null, vals);
  const total = vals.reduce(function (a, b) { return a + b; }, 0);
  const iPico = vals.indexOf(max);
  const fmtV = tipo === 'moeda' ? fmtK : function (v) { return String(v); };
  const colunas = horas.map(function (h, i) {
    const alt = Math.max(3, Math.round((vals[i] / max) * 110));
    const pico = i === iPico;
    return '<div class="g-col"><span class="g-v' + (pico ? ' pk' : '') + '">' + (vals[i] ? fmtV(vals[i]) : '') + '</span>' +
      '<div class="g-b" style="height:' + alt + 'px;background:' + (pico ? corPico : cor) + '"></div>' +
      '<span class="g-h">' + h + 'h</span></div>';
  }).join('');
  const picoTxt = tipo === 'moeda'
    ? 'Pico <b>' + horas[iPico] + 'h</b> · ' + fmtMoeda(max)
    : 'Pico <b>' + horas[iPico] + 'h</b> · ' + fmt(max) + ' entradas';
  const totalTxt = tipo === 'moeda' ? fmtMoeda(total) : fmt(total);
  return '<div class="card-outline"><p class="b-st">' + titulo + '</p>' +
    '<div class="g-kpis"><span>' + picoTxt + '</span><span>Total <b>' + totalTxt + '</b></span></div>' +
    '<div class="g-chart">' + colunas + '</div></div>';
}

function fmt(n) { return (Number(n) || 0).toLocaleString('pt-BR'); }
function fmtMoeda(n) {
  return 'R$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function tempoRelativo(iso) {
  if (!iso) return 'agora';
  const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (diffMin < 1) return 'agora mesmo';
  if (diffMin === 1) return 'há 1 min';
  return 'há ' + diffMin + ' min';
}


async function carregar() {
  const q = CHAVE ? '?chave=' + encodeURIComponent(CHAVE) : '?';
  const sep = CHAVE ? '&' : '';
  try {
    if (HISTORICO) {
      const resp = await fetch('/api/noites' + q, { cache: 'no-store' });
      const r = await resp.json();
      if (resp.status === 401) return semSessao(r.erro);
      if (r.trocar_pin) { location.href = '/entrar'; return; }
      if (r.erro) throw new Error(r.erro);
      renderizarLista(r.noites, r.proximas, r.hoje);
    } else {
      const resp = await fetch('/api/painel' + q + (NOITE ? sep + 'noite=' + encodeURIComponent(NOITE) : ''), { cache: 'no-store' });
      const r = await resp.json();
      if (resp.status === 401) return semSessao(r.erro);
      if (r.trocar_pin) { location.href = '/entrar'; return; }
      if (r.erro) throw new Error(r.erro);
      HOJE = r.hoje; configurarNav();
      if (!CHAVE) document.getElementById('link-sair').style.display = '';
      if (r.admin && !CHAVE) { const l = document.getElementById('link-admin'); if (l) l.style.display = ''; }
      if (r.sem_noite) { document.getElementById('nome-evento').textContent = r.nome ? 'Olá, ' + r.nome : 'Painel'; document.getElementById('atualizado').textContent = ''; document.getElementById('conteudo').innerHTML = '<div class="empty">Nenhuma noite liberada para o seu acesso por enquanto.<br>Quando for a sua noite, ela aparece aqui sozinha.</div>'; return; }
      renderizar(r.painel, r.hoje, r.noite, !!r.ao_vivo, !!r.proxima);
    }
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<div class="empty">Não consegui carregar agora (' + esc(e.message) + '). Tentando de novo em instantes.</div>';
  }
}
function semSessao(msg) {
  document.getElementById('nome-evento').textContent = 'Painel Bosque';
  document.getElementById('atualizado').textContent = '';
  document.getElementById('conteudo').innerHTML = '<div class="empty">' + esc(msg || 'Abra o link que você recebeu por WhatsApp e digite o seu PIN.') + '</div>';
}
document.getElementById('link-sair').onclick = function (e) { e.preventDefault(); fetch('/api/sair', { method: 'POST' }).finally(function () { document.cookie = 'x=; Max-Age=0'; location.href = '/painel'; }); };
configurarNav();
carregar();
if (!HISTORICO) setInterval(carregar, 30000);
</script>
