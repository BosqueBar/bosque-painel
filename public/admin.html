<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<title>Administração · Painel Bosque</title>
<style>
  :root {
    --bg: #F7F3E9; --surface1: #FFFDF7; --surface2: #FBF7EC; --border: #E1D8C0;
    --text-primary: #1B3A1E; --text-secondary: #55624C; --text-muted: #8C8468;
    --teal: #2B4E2F; --coral: #B98A2E; --pink: #8B4049; --blue: #2C5F5A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px; margin-left: auto; margin-right: auto;
  }
  a { color: inherit; text-decoration: none; }
  .brandbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brandbar img { width: 34px; height: auto; border-radius: 50%; flex-shrink: 0; }
  .brandbar span { font-size: 12px; letter-spacing: 0.02em; color: var(--text-muted); }
  .header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .header h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; margin: 0; color: var(--text-primary); }
  .header p { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }
  .nav-link { font-size: 12px; color: var(--teal); white-space: nowrap; padding: 6px 12px;
    border: 1px solid var(--teal); border-radius: 999px; }
  .card { background: var(--surface1); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .card-outline { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .label { font-size: 12px; color: var(--text-muted); margin: 0 0 4px; }
  .value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; margin: 0; color: var(--text-primary); }
  .sub-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .sub-row strong { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .section-title { font-size: 12px; color: var(--text-secondary); margin: 0 0 10px; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 8px; background: var(--border); }
  .bar-teal { background: var(--teal); } .bar-coral { background: var(--coral); }
  .bar-pink { background: var(--pink); } .bar-blue { background: var(--blue); }
  .legend { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-secondary); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; }
  table { width: 100%; font-size: 12px; border-collapse: collapse; color: var(--text-secondary); }
  td { padding: 3px 0; }
  .td-right { text-align: right; }
  .muted { color: var(--text-muted); }
  .empty { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
  .item-lista { display: block; background: var(--surface1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    margin-bottom: 8px; }
  .item-lista .nome { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; margin: 0 0 2px; color: var(--text-primary); }
  .item-lista .data { font-size: 12px; color: var(--text-muted); margin: 0; }
  .badge-passado { display: inline-block; font-size: 11px; color: var(--coral);
    border: 1px solid var(--coral); border-radius: 999px; padding: 3px 10px; margin-bottom: 10px; }
  /* layout B */
  .b-hero { display: flex; justify-content: space-between; align-items: flex-end; }
  .b-hero .r { text-align: right; }
  .b-hero .r b { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 700; color: var(--text-primary); }
  .b-big { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1; margin: 0; color: var(--text-primary); }
  .b-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .b-chip { font-size: 11px; color: var(--text-muted); }
  .b-chip b { display: block; font-size: 15px; color: var(--text-primary); margin-top: 2px; }
  .b-chip em { font-style: normal; font-weight: 400; font-size: 11px; color: var(--text-muted); }
  .b-val { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; margin: 0; color: var(--text-primary); }
  .b-tm { font-size: 12px; margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--border); color: var(--text-secondary); }
  .b-tm b { color: var(--text-primary); }
  .b-tm span { display: block; font-size: 11px; color: var(--text-muted); }
  .b-st { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 0 0 10px; }
  .b-pc { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
  .b-table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text-secondary); }
  .b-table th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-align: right; padding: 5px 0; }
  .b-table th:first-child { text-align: left; }
  .b-table td { padding: 5px 0; }
  .b-table td.n { text-align: right; color: var(--text-primary); }
  .b-table tr + tr td { border-top: 1px solid #EFE7D2; }
  .b-nota { font-size: 11px; color: var(--text-muted); margin: 8px 0 0; }
  .g-kpis { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin: 0 0 4px; }
  .g-kpis b { color: var(--text-primary); }
  .g-chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin-top: 6px; }
  .g-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
  .g-col .g-b { width: 100%; border-radius: 5px 5px 2px 2px; min-height: 3px; }
  .g-col .g-v { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; white-space: nowrap; }
  .g-col .g-v.pk { color: var(--text-primary); font-weight: 700; }
  .g-col .g-h { font-size: 10px; color: var(--text-muted); margin-top: 5px; }
  .fontes { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  .fonte { font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text-secondary); background:var(--surface1); }
  .fonte.velha { border-color:#B3261E; color:#B3261E; background:#FDECEA; }
  .fonte.erro { border-color:#B98A2E; color:#8A6420; background:#FBF1DC; }
  .avisos { font-size:11px; color:var(--text-muted); margin:0 0 10px; }

  input, select { width:100%; background:var(--surface1); border:1px solid var(--border); border-radius:10px; color:var(--text-primary); padding:12px; font-size:15px; font-family:inherit; }
  label.l { display:block; font-size:13px; color:var(--text-secondary); margin:14px 0 6px; }
  button.bt { background:var(--teal); color:var(--bg); border:none; border-radius:10px; padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button.bt.sec { background:transparent; color:var(--teal); border:1px solid var(--teal); }
  button.bt.peq { padding:7px 12px; font-size:12px; }
  button.bt.perigo { background:transparent; color:#B3261E; border:1px solid #B3261E; }
  button.bt:disabled { opacity:.5; }
  .erro { color:#B3261E; font-size:13px; margin:10px 0 0; min-height:18px; }
  .ok { color:var(--teal); font-size:13px; margin:10px 0 0; }

  .abas { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px; }
  .aba { font-size:13px; padding:7px 13px; border:1px solid var(--border); border-radius:999px; background:var(--surface1); color:var(--text-secondary); cursor:pointer; }
  .aba.on { background:var(--teal); color:var(--bg); border-color:var(--teal); }
  .pess { background:var(--surface1); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; }
  .pess h3 { font-family:'Fraunces',serif; font-size:16px; margin:0 0 2px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
  .chip { font-size:11px; padding:3px 9px; border-radius:999px; background:var(--surface2); border:1px solid var(--border); color:var(--text-secondary); }
  .chip.verde { background:#E4EFE2; color:var(--teal); border-color:#BCD3B8; }
  .chip.verm { background:#FDECEA; color:#B3261E; border-color:#F0BFBA; }
  .acoes { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .dias { display:flex; flex-wrap:wrap; gap:8px; }
  .dias label, .perms label { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--text-secondary); }
  .dias input, .perms input { width:auto; }
  .perms { display:flex; flex-direction:column; gap:8px; }
  .caixa { background:#FFF9E6; border:1px solid #E7D49A; border-radius:12px; padding:14px; margin:12px 0; font-size:13px; word-break:break-all; }
  .caixa b { display:block; font-size:12px; color:var(--text-muted); margin-top:8px; }
  .caixa .grande { font-family:monospace; font-size:22px; letter-spacing:.2em; color:var(--text-primary); }
  table.t { width:100%; border-collapse:collapse; font-size:12px; }
  table.t td, table.t th { padding:6px 4px; border-bottom:1px solid var(--border); text-align:left; }
  .linha { display:flex; gap:8px; align-items:center; }
  .linha > * { flex:1; }
  .linha > button { flex:0 0 auto; }
</style>
</head>
<body>
  <div class="brandbar"><img src="/logo.png" alt="Bosque"><span>bosque. · administração</span></div>
  <div class="header"><div><h1>Administração</h1><p id="quem"></p></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><a class="nav-link" href="/painel">← Painel</a><a class="nav-link" id="sair" href="#" style="border-color:var(--text-muted);color:var(--text-muted)">Sair</a></div></div>
  <div id="raiz"></div>
<script>
const P = new URLSearchParams(location.search);
const CHAVE = P.get('chave') || '';
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const raiz = document.getElementById('raiz');
const sem = function (t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); };
let MODELOS = {}, PESSOAS = [], ABA = 'pessoas', ONLINE = [], APARELHOS = {}, BUSCA = '';

function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
async function chamar(metodo, rota, corpo) {
  const r = await fetch(rota, { method: metodo, headers: { 'Content-Type': 'application/json' }, body: corpo ? JSON.stringify(corpo) : undefined, cache: 'no-store' });
  const j = await r.json().catch(function () { return {}; });
  if (!r.ok) { const e = new Error(j.erro || 'Erro ' + r.status); e.status = r.status; throw e; }
  return j;
}
function dataBR(iso) { return iso ? iso.split('-').reverse().join('/') : ''; }
function quando(iso) { if (!iso) return 'nunca'; const d = new Date(iso); return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); }
function minutos(iso) { if (!iso) return null; return Math.round((Date.now() - new Date(iso).getTime()) / 60000); }
function copiar(txt, btn) { navigator.clipboard.writeText(txt).then(function () { if (btn) { const o = btn.textContent; btn.textContent = 'Copiado!'; setTimeout(function () { btn.textContent = o; }, 1500); } }); }
function zap(txt) { return 'https://api.whatsapp.com/send?text=' + encodeURIComponent(txt); }
// No celular abre a folha de compartilhar (WhatsApp aparece na lista); no computador abre o WhatsApp Web/aplicativo.
document.addEventListener('click', function (e) {
  const a = e.target.closest && e.target.closest('a[href^="https://api.whatsapp.com/send"]');
  if (!a) return;
  const txt = decodeURIComponent(a.getAttribute('href').split('text=')[1] || '');
  if (navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent)) { e.preventDefault(); navigator.share({ text: txt }).catch(function () {}); }
});

// ---------- início: sessão ou criação do acesso da administradora ----------
async function iniciar() {
  try {
    const eu = await chamar('GET', '/api/eu');
    if (!eu.admin) { raiz.innerHTML = '<div class="empty">Esta área é só para a administradora.</div>'; return; }
    document.getElementById('quem').textContent = 'Olá, ' + eu.nome;
    desenhar();
  } catch (e) {
    if (e.status === 401) {
      if (CHAVE) criarAdmin();
      else raiz.innerHTML = '<div class="empty">Abra o seu link de administradora (o que termina com /a/…) e digite o PIN.</div>';
    } else raiz.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}
function criarAdmin() {
  raiz.innerHTML = '<div class="card"><p class="b-st">Criar o meu acesso de administradora</p>' +
    '<p style="font-size:13px;color:var(--text-secondary);margin:0">Escolha um PIN de 6 números. Vou gerar o seu link pessoal; guarde-o nos favoritos. Se já existir um acesso de administradora, este passo troca o link e o PIN dele.</p>' +
    '<label class="l">Seu nome</label><input id="a-nome" value="Annie">' +
    '<label class="l">PIN (6 números)</label><input id="a-pin" inputmode="numeric" maxlength="6">' +
    '<p class="erro" id="a-erro"></p><button class="bt" id="a-ok" style="width:100%">Criar meu acesso</button></div>';
  document.getElementById('a-ok').onclick = async function () {
    const erro = document.getElementById('a-erro'); erro.textContent = '';
    try {
      const j = await chamar('POST', '/api/admin/iniciar?chave=' + encodeURIComponent(CHAVE), { nome: document.getElementById('a-nome').value, pin: document.getElementById('a-pin').value.trim() });
      raiz.innerHTML = '<div class="card"><p class="b-st">Pronto! Este é o seu link de administradora</p><div class="caixa">' + esc(j.link) + '</div>' +
        '<p style="font-size:13px;color:var(--text-secondary)">1) Copie o link e salve nos favoritos (ele só aparece agora). 2) Abra o link e digite o seu PIN.</p>' +
        '<button class="bt" id="a-cp">Copiar link</button> <a class="bt sec" style="text-decoration:none;display:inline-block" href="' + esc(j.link) + '">Abrir agora</a></div>';
      document.getElementById('a-cp').onclick = function () { copiar(j.link, this); };
    } catch (e) { erro.textContent = e.message; }
  };
}

// ---------- abas ----------
function desenhar() {
  const abas = [['pessoas', 'Pessoas'], ['acessos', 'Quem acessa'], ['noites', 'Noites extras'], ['zig', 'Tokens da Zig'], ['saude', 'Saúde'], ['historico', 'Histórico']];
  raiz.innerHTML = '<div class="abas">' + abas.map(function (a) { return '<span class="aba' + (ABA === a[0] ? ' on' : '') + '" data-aba="' + a[0] + '">' + a[1] + '</span>'; }).join('') + '</div><div id="aba"></div>';
  Array.prototype.forEach.call(raiz.querySelectorAll('.aba'), function (el) { el.onclick = function () { ABA = el.getAttribute('data-aba'); desenhar(); }; });
  ({ pessoas: abaPessoas, acessos: abaAcessos, noites: abaNoites, zig: abaZig, saude: abaSaude, historico: abaHistorico })[ABA]();
}
const el = function () { return document.getElementById('aba'); };

// ---------- pessoas ----------
async function abaPessoas() {
  el().innerHTML = '<div class="empty">Carregando…</div>';
  const [j, ac] = await Promise.all([chamar('GET', '/api/admin/pessoas'), chamar('GET', '/api/admin/acessos')]);
  PESSOAS = j.pessoas; MODELOS = j.modelos; ONLINE = ac.online.map(function (x) { return x.id; }); APARELHOS = ac.aparelhos_por_pessoa;
  listaPessoas();
}
function resumoDias(p) {
  const d = (p.dias || []).map(function (n) { return DIAS[n]; }).join(', ') || 'nenhum dia da semana';
  return d + ((p.datas || []).length ? ' + ' + p.datas.map(dataBR).join(', ') : '');
}
function listaPessoas(extra) {
  el().innerHTML = (extra || '') + '<div style="margin-bottom:12px" class="acoes"><button class="bt" data-a="nova">+ Nova pessoa</button><button class="bt sec" data-a="lote">Cadastrar várias de uma vez</button><button class="bt sec" data-a="todostroca">Pedir troca de PIN a todos</button></div>' +
    '<input id="busca" type="search" placeholder="Buscar por nome ou modelo (ex.: Rodrigo, Full, Sexta)" value="' + esc(BUSCA) + '" style="margin-bottom:12px">' +
    '<div id="lista-p">' + conteudoLista() + '</div>';
  el().onclick = acaoPessoa;
  const campo = document.getElementById('busca');
  campo.oninput = function () { BUSCA = this.value; document.getElementById('lista-p').innerHTML = conteudoLista(); };
  if (BUSCA) { campo.focus(); campo.setSelectionRange(BUSCA.length, BUSCA.length); }
}
function filtradas() {
  const q = sem(BUSCA).trim(); if (!q) return PESSOAS;
  return PESSOAS.filter(function (p) {
    const alvo = sem(p.nome + ' ' + (p.modelo === 'admin' ? 'administrador' : ((MODELOS[p.modelo] || {}).rotulo || p.modelo)) + ' ' + (p.ativo ? '' : 'desativado') + ' ' + (p.bloqueado ? 'bloqueado' : '') + ' ' + resumoDias(p));
    return q.split(/\s+/).every(function (t) { return alvo.indexOf(t) >= 0; });
  });
}
function conteudoLista() {
  const lista = filtradas();
  return (BUSCA ? '<p style="font-size:12px;color:var(--text-muted);margin:0 0 8px">' + lista.length + ' de ' + PESSOAS.length + ' pessoa(s)</p>' : '') +
    (lista.length ? lista.map(function (p) {
      const perms = [p.perm_contagem ? 'Contagem' : '', p.perm_bilheteria ? 'Bilheteria' : '', p.perm_bar ? 'Bar' : ''].filter(Boolean);
      const adm = p.modelo === 'admin';
      return '<div class="pess"><h3>' + esc(p.nome) + (ONLINE.indexOf(p.id) >= 0 ? ' <span class="chip verde">online agora</span>' : '') + '</h3>' +
        '<div style="font-size:12px;color:var(--text-muted)">' + esc(adm ? 'Administrador' : ((MODELOS[p.modelo] || {}).rotulo || p.modelo)) + ' · ' + resumoDias(p) + (p.validade ? ' · até ' + dataBR(p.validade) : '') + '</div>' +
        '<div class="chips">' + perms.map(function (x) { return '<span class="chip verde">' + x + '</span>'; }).join('') +
        (p.ativo ? '' : '<span class="chip verm">desativado</span>') + (p.bloqueado ? '<span class="chip verm">bloqueado (PIN errado)</span>' : '') + (p.aguardando_troca ? '<span class="chip" style="background:#FFF9E6;border-color:#E7D49A">aguardando troca de PIN</span>' : '') +
        '<span class="chip">' + (APARELHOS[p.id] || 0) + ' aparelho(s)</span></div>' +
        '<div class="acoes">' + (adm ? '' : '<button class="bt sec peq" data-a="editar" data-id="' + p.id + '">Editar</button>') +
        '<button class="bt sec peq" data-a="ver" data-id="' + p.id + '">Ver / reenviar link</button>' +
        '<button class="bt sec peq" data-a="link" data-id="' + p.id + '">Trocar link (só se vazou)</button>' +
        '<button class="bt sec peq" data-a="pin" data-id="' + p.id + '">Trocar PIN</button>' + (adm ? '' : '<button class="bt sec peq" data-a="troca" data-id="' + p.id + '">Pedir troca de PIN</button>') +
        (p.bloqueado ? '<button class="bt peq" data-a="desbloquear" data-id="' + p.id + '">Desbloquear</button>' : '') +
        (adm ? '' : '<button class="bt sec peq" data-a="ativo" data-id="' + p.id + '">' + (p.ativo ? 'Desativar' : 'Reativar') + '</button><button class="bt perigo peq" data-a="excluir" data-id="' + p.id + '">Excluir</button>') + '</div></div>';
    }).join('') : '<div class="empty">' + (PESSOAS.length ? 'Ninguém encontrado com essa busca.' : 'Ninguém cadastrado ainda.') + '</div>');
}
function msgAcesso(nome, link, pin) {
  return 'Oi, ' + nome.split(' ')[0] + '! Este é o seu link para o painel em tempo real do Bosque: ' + link +
    (pin ? '\n\nPIN provisório: ' + pin + '\nNo primeiro acesso você escolhe o seu próprio PIN. Salve o link na tela inicial do celular.' : '');
}
function caixaAcesso(nome, link, pin, titulo) {
  return '<div class="caixa"><b style="margin-top:0">' + esc(titulo) + '</b>' +
    '<b>Link</b>' + esc(link) + (pin ? '<b>PIN provisório</b><span class="grande">' + esc(pin) + '</span>' : '') +
    '<div class="acoes"><a class="bt peq" style="text-decoration:none" target="_blank" href="' + zap(msgAcesso(nome, link, pin)) + '">Encaminhar por WhatsApp</a>' +
    '<button class="bt sec peq" data-copiar="' + esc(msgAcesso(nome, link, pin)) + '">Copiar mensagem</button></div>' +
    '<p style="font-size:12px;color:var(--text-muted);margin:8px 0 0">' + (pin ? 'No primeiro acesso a pessoa troca o PIN provisório pelo próprio. ' : '') + 'O link é fixo e você pode reenviá-lo quando quiser em "Ver / reenviar link".</p></div>';
}
async function acaoPessoa(ev) {
  const c = ev.target.closest('[data-copiar]'); if (c) return copiar(c.getAttribute('data-copiar'), c);
  const b = ev.target.closest('[data-a]'); if (!b) return;

const DIA_NOME = { domingo: 0, segunda: 1, terca: 2, quarta: 3, quinta: 4, sexta: 5, sabado: 6 };
function interpretarLinha(txt) {
  const cols = txt.split('\t').map(function (c) { return c.trim(); });
  if (cols.length < 2 || !cols[0]) return null;
  const nome = cols[0], acesso = sem(cols[1]), diasTxt = sem(cols[2] || ''), pin = (cols[3] || '').replace(/\D/g, '');
  if (nome.toLowerCase() === 'nome') return null; // cabeçalho
  const modelos = [];
  if (/full/.test(acesso)) modelos.push('full');
  if (/operacional/.test(acesso)) modelos.push('operacional');
  if (/bsqnt|quinta/.test(acesso)) modelos.push('socios_bsqnt');
  if (/sexta/.test(acesso)) modelos.push('socios_sexta');
  if (/sabado/.test(acesso)) modelos.push('socios_sabado');
  if (/sambinha|domingo/.test(acesso)) modelos.push('socios_sambinha');
  let dias = [];
  if (/todos/.test(diasTxt)) dias = [0, 1, 2, 3, 4, 5, 6];
  else Object.keys(DIA_NOME).forEach(function (k) { if (diasTxt.indexOf(k) >= 0) dias.push(DIA_NOME[k]); });
  if (!dias.length) modelos.forEach(function (m) { (MODELOS[m] ? MODELOS[m].dias : []).forEach(function (d) { if (dias.indexOf(d) < 0) dias.push(d); }); });
  return { nome: nome, modelo: modelos[0] || '', modelos: modelos, dias: dias, pin: pin, acessoTxt: cols[1], diasTxt: cols[2] || '' };
}

    '<details style="margin:10px 0"><summary style="font-size:13px;color:var(--text-secondary);cursor:pointer">Token do bar (Zig ERP), só se ele mudar</summary><div class="pess" style="margin-top:8px"><div style="font-size:12px;color:var(--text-muted)">' + estadoToken(j.token_zig) + '</div>' +
    '<div class="linha" style="margin-top:8px"><input type="password" autocomplete="off" id="tk-BAR" placeholder="cole o token do bar"><button class="bt peq" data-tk="BAR">Salvar</button></div></div></details>';
  el().onclick = async function (e) {
    const b = e.target.closest('[data-tk]'); if (!b) return;
    const d = b.getAttribute('data-tk'), campo = document.getElementById('tk-' + d);
    document.getElementById('tk-erro').textContent = ''; document.getElementById('tk-ok').textContent = '';
    try {
      await chamar('POST', d === 'BAR' ? '/api/admin/zig-token' : '/api/admin/tokens-porta', d === 'BAR' ? { token: campo.value } : { dia: d, token: campo.value });
      campo.value = ''; await abaZig(); document.getElementById('tk-ok').textContent = 'Token salvo.';
    } catch (x) { document.getElementById('tk-erro').textContent = x.message; }
  };
}

// ---------- importar histórico da planilha antiga ----------
function lerTabela(texto) { // CSV (vírgula) ou colado do Google Sheets (tab); respeita aspas
  const primeira = texto.split(/\r?\n/)[0] || '';
  const sep = primeira.indexOf('\t') >= 0 ? '\t' : ',';
  const linhas = []; let cel = '', lin = [], asp = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (asp) { if (c === '"') { if (texto[i + 1] === '"') { cel += '"'; i++; } else asp = false; } else cel += c; }
    else if (c === '"' && cel === '') asp = true;
    else if (c === sep) { lin.push(cel); cel = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; lin.push(cel); cel = ''; if (lin.some(function (x) { return x !== ''; })) linhas.push(lin); lin = []; }
    else cel += c;
  }
  lin.push(cel); if (lin.some(function (x) { return x !== ''; })) linhas.push(lin);
  if (linhas.length < 2) return [];
  const cab = linhas[0].map(function (x) { return x.trim().toLowerCase().replace(/\s+/g, '_'); });
  return linhas.slice(1).map(function (l) { const o = {}; cab.forEach(function (k, i) { if (k) o[k] = (l[i] || '').trim(); }); return o; }).filter(function (o) { return /\d/.test(o.data || ''); });
}
function abaHistorico() {
  el().innerHTML = '<div class="card"><p class="b-st">Trazer o histórico da planilha antiga</p>' +
    '<p style="font-size:13px;color:var(--text-secondary);margin:0">Na planilha <b>BOSQUE_BAR_Dashboard</b> (aba Painel_Consolidado): selecione tudo (Ctrl+A), copie (Ctrl+C) e cole abaixo, ou baixe como CSV e escolha o arquivo. A primeira linha tem que ser o cabeçalho. Noites que já existem aqui são substituídas pelas da planilha (a planilha tem a porta das noites passadas, que o app novo não consegue reler). A noite de hoje e as futuras não são mexidas.</p>' +
    '<label class="l">Arquivo CSV</label><input type="file" id="h-arq" accept=".csv,.tsv,.txt">' +
    '<label class="l">ou cole aqui</label><textarea id="h-txt" rows="6" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px;font-family:monospace" placeholder="Cole aqui"></textarea>' +
    '<div id="h-prev"></div><p class="erro" id="h-erro"></p><p class="ok" id="h-ok"></p><button class="bt" id="h-btn" disabled>Importar</button></div>';
  let linhas = [];
  const prev = document.getElementById('h-prev'), btn = document.getElementById('h-btn');
  function prever(texto) {
    linhas = lerTabela(texto);
    prev.innerHTML = linhas.length ? '<p style="font-size:13px;margin:10px 0 0"><b>' + linhas.length + '</b> noite(s) encontradas: ' + esc(linhas[0].data) + ' até ' + esc(linhas[linhas.length - 1].data) + '</p>' : '<p style="font-size:13px;color:var(--text-muted);margin:10px 0 0">Nada reconhecido ainda (confira se colou o cabeçalho junto).</p>';
    btn.disabled = !linhas.length;
  }
  document.getElementById('h-txt').oninput = function () { prever(this.value); };
  document.getElementById('h-arq').onchange = function () { const f = this.files[0]; if (!f) return; const r = new FileReader(); r.onload = function () { document.getElementById('h-txt').value = ''; prever(String(r.result)); }; r.readAsText(f, 'utf-8'); };
  btn.onclick = async function () {
    btn.disabled = true; btn.textContent = 'Importando…'; document.getElementById('h-erro').textContent = ''; document.getElementById('h-ok').textContent = '';
    try {
      const j = await chamar('POST', '/api/admin/historico', { linhas: linhas });
      if (!j.importadas) throw new Error('Nenhuma noite foi gravada' + (j.puladas.length ? ' (só havia hoje/futuras: ' + j.puladas.join(', ') + ')' : '') + '. Confira se o cabeçalho foi colado junto.');
      const conf = await chamar('GET', '/api/noites');
      const todas = (conf.noites || []).concat(conf.hoje || []);
      document.getElementById('h-ok').textContent = j.importadas + ' noite(s) gravadas (de ' + j.noites[0] + ' até ' + j.noites[j.noites.length - 1] + ')' + (j.puladas.length ? ' · puladas (hoje/futuras): ' + j.puladas.join(', ') : '') + '. Conferência: o painel agora tem ' + todas.length + ' noite(s) no histórico. Veja em Painel → Eventos.';
    } catch (e) { document.getElementById('h-erro').textContent = e.message; }
    btn.disabled = false; btn.textContent = 'Importar';
  };
}

// ---------- saúde das fontes ----------
const NOME = { sympla: 'Sympla (venda antecipada)', zig_ingressos: 'Porta (SuperTicket)', zig_bar: 'Bar (Zig)', ugo: 'Lista (UGO)' };
async function abaSaude() {
  const j = await chamar('GET', '/api/admin/fontes');
  const linhas = Object.keys(NOME).map(function (k) {
    const f = j.fontes.find(function (x) { return x.fonte === k; });
    if (!f) return '<tr><td>' + NOME[k] + '</td><td><span class="chip verm">sem leitura</span></td><td></td></tr>';
    const m = minutos(f.atualizado_em), velha = j.ao_vivo && (m === null || m > (j.limite_min || 3));
    const estado = f.erro ? '<span class="chip verm">falha</span>' : (velha ? '<span class="chip verm">atrasada</span>' : '<span class="chip verde">ok</span>');
    return '<tr><td>' + NOME[k] + '</td><td>' + estado + '</td><td>' + (m === null ? 'nunca' : 'há ' + m + ' min') + (f.erro ? '<br><span style="color:#B3261E">' + esc(f.erro) + '</span>' : '') + '</td></tr>';
  }).join('');
  el().innerHTML = '<div class="card"><p class="b-st">Fontes da noite ' + dataBR(j.noite) + (j.ao_vivo ? ' (ao vivo)' : ' (fora do horário de evento)') + '</p><table class="t"><tr><th>Fonte</th><th>Estado</th><th>Última leitura</th></tr>' + linhas + '</table>' +
    '<p style="font-size:12px;color:var(--text-muted);margin:10px 0 0">Durante o evento, a fonte fica "atrasada" se passar de 3 minutos sem ler (antes da abertura, a leitura é a cada 30 minutos). Se a Zig aparecer em falha na segunda, é só colar o token novo.</p></div>' + cartaoSympla(j.noite) + cartaoPlanilha(j.exportacao);
  document.getElementById('bt-exportar').onclick = enviarPlanilha;
  document.getElementById('bt-sy-ver').onclick = verEventosSympla;
}
function cartaoSympla(noite) {
  return '<div class="card" style="margin-top:12px"><p class="b-st">Sympla: eventos da noite</p>' +
    '<p style="font-size:12px;color:var(--text-muted);margin:0 0 10px">Se a venda antecipada do painel estiver menor que a da Sympla, a noite pode ter mais de um evento na Sympla. Veja a lista e marque todos os que devem ser somados.</p>' +
    '<input type="date" id="sy-dia" value="' + esc(noite || '') + '" style="margin-bottom:10px"> <button class="bt sec" id="bt-sy-ver">Ver eventos desta data</button><div id="res-sy" style="margin-top:10px;font-size:13px"></div></div>';
}
async function verEventosSympla() {
  const box = document.getElementById('res-sy'), dia = document.getElementById('sy-dia').value;
  if (!dia) { box.textContent = 'Escolha a data.'; return; }
  box.textContent = 'Buscando na Sympla…';
  try {
    const r = await chamar('GET', '/api/admin/sympla-eventos?dia=' + encodeURIComponent(dia));
    if (!r.eventos.length) { box.textContent = 'A Sympla não tem nenhum evento começando nessa data.'; return; }
    box.innerHTML = r.eventos.map(function (e) {
      return '<label style="display:block;margin:6px 0"><input type="checkbox" class="sy-ck" value="' + esc(e.id) + '"' + (r.escolhidos.indexOf(e.id) >= 0 ? ' checked' : '') + '> ' + esc(e.nome) + ' <span style="color:var(--text-muted)">(' + esc(e.inicio.substring(11, 16)) + ' · código ' + esc(e.id) + ')</span></label>';
    }).join('') + '<p style="color:var(--text-muted);font-size:12px;margin:6px 0">' + (r.escolhidos.length ? 'Marcados = os que o painel está somando agora.' : 'Nenhum escolhido ainda: o painel usa o primeiro que encontrar.') + '</p><button class="bt" id="bt-sy-usar">Somar os marcados e reler agora</button><div id="res-sy2" style="margin-top:8px"></div>';
    document.getElementById('bt-sy-usar').onclick = function () {
      const ids = Array.prototype.map.call(document.querySelectorAll('.sy-ck:checked'), function (c) { return c.value; });
      const b2 = document.getElementById('res-sy2'); if (!ids.length) { b2.textContent = 'Marque pelo menos um evento.'; return; }
      b2.textContent = 'Lendo a Sympla…';
      chamar('POST', '/api/admin/sympla-eventos', { dia: dia, ids: ids }).then(function (x) {
        b2.innerHTML = '<b>Pronto.</b> Vendidos (aprovados): ' + x.vendidos + ' · Bilheteria Sympla: R$ ' + Number(x.bilheteria_sympla).toLocaleString('pt-BR') + '<br><span style="color:var(--text-muted)">A Sympla devolveu ' + x.participantes_na_api + ' ingressos no total, dos quais ' + x.nao_aprovados + ' não aprovados' + (x.nao_aprovados ? ' (' + Object.keys(x.status_nao_aprovados || {}).map(function (k) { return k + ': ' + x.status_nao_aprovados[k]; }).join(', ') + ')' : '') + ' e ' + x.cortesias + ' cortesias. Pedidos: ' + x.pedidos_na_api + ' · ingressos contados nos pedidos: ' + (x.ingressos_nos_pedidos === null || x.ingressos_nos_pedidos === undefined ? 'não informado' : x.ingressos_nos_pedidos) + ' <br>Paginação dos participantes: <code>' + esc(JSON.stringify(x.paginacao_participantes || {})) + '</code><br>Pedidos sem ingresso na lista: <code>' + esc(JSON.stringify(x.faltantes || {})) + '</code>' + ' <br>UGO: <code>' + esc(JSON.stringify(x.ugo || {})) + '</code> · valor lido de: ' + esc(x.valor_origem || '') + (x.aviso ? '<br>' + esc(x.aviso) : '') + '. Recarregue o painel.</span>';
      }).catch(function (e) { b2.innerHTML = '<span style="color:#B3261E">' + esc(e.message || 'Falhou.') + '</span>'; });
    };
  } catch (e) { box.innerHTML = '<span style="color:#B3261E">' + esc(e.message || 'Falhou.') + '</span>'; }
}
function cartaoPlanilha(x) {
  const u = x && x.ultimo;
  let estado;
  if (!x || !x.configurada) estado = '<span class="chip verm">não configurada</span> <span style="font-size:12px;color:var(--text-muted)">falta colocar o endereço e a senha da planilha na Cloudflare</span>';
  else if (!u) estado = '<span class="chip">ainda não rodou sozinha</span> <span style="font-size:12px;color:var(--text-muted)">grava às 5h10 e às 10h</span>';
  else {
    const e = u.resultado && u.resultado.envio, ok = e && e.ok;
    estado = '<span class="chip ' + (ok ? 'verde' : 'verm') + '">' + (ok ? 'última gravação ok' : 'última gravação com erro') + '</span> <span style="font-size:12px;color:var(--text-muted)">' + (u.modo === 'fechamento' ? 'fechamento 5h' : 'refaz 10h') + ' · ' + quando(u.em) + (ok ? '' : ' · ' + esc((e && e.erro) || 'sem resposta')) + '</span>';
  }
  return '<div class="card" style="margin-top:12px"><p class="b-st">Planilha antiga (Painel_Consolidado)</p><p style="margin:0 0 10px">' + estado + '</p>' +
    '<button class="bt sec" id="bt-exportar">Enviar as últimas noites para a planilha agora</button><div id="res-exportar" style="font-size:13px;margin-top:10px"></div>' +
    '<p style="font-size:12px;color:var(--text-muted);margin:10px 0 0">O botão envia o que já está guardado aqui (não relê Sympla/Zig). Sozinho, o app grava às 5h10 (a noite que fechou) e às 10h (refaz a Sympla das últimas 7 noites e a Zig das últimas 2).</p></div>';
}
async function enviarPlanilha() {
  const box = document.getElementById('res-exportar'); box.textContent = 'Enviando…';
  try {
    const r = await chamar('POST', '/api/admin/exportar', {}), x = r.resultado || {};
    box.innerHTML = x.ok === false ? '<span style="color:#B3261E">' + esc(x.erro || 'Falhou.') + '</span>'
      : 'Enviado: ' + (x.gravadas || []).map(function (g) { return dataBR(g.dia) + ' (' + g.acao + ')'; }).join(', ') + (x.aviso ? ' — ' + esc(x.aviso) : '') +
        ((x.ignoradas && x.ignoradas.length) ? '<br><span style="color:var(--text-muted)">Sem coluna na planilha (não gravados): ' + esc(x.ignoradas.join(', ')) + '</span>' : '');
  } catch (e) { box.innerHTML = '<span style="color:#B3261E">' + esc(e.message || 'Falhou.') + '</span>'; }
}
document.getElementById('sair').onclick = function (e) { e.preventDefault(); fetch('/api/sair', { method: 'POST' }).finally(function () { location.href = '/painel'; }); };
iniciar();
</script>
